name: ci

# Principle VII gate: the suite must be green on every push/PR, and the public
# CLI contract must emit valid JSON. See
# specs/011-adapter-contract-ci/contracts/ci-workflow.md.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the constitution floor; 3.12 matches the Docker image.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest -q

      - name: CLI JSON smoke (public contract)
        # Positional CLI args: <file> <task> <mode> <format>. A single task is
        # used so stdout is pure JSON (task `all` also renders the graph to
        # stdout). graphviz is intentionally not installed: rendering degrades
        # gracefully and is not needed for the JSON payload.
        run: |
          python sg_cli.py tests/fixtures/solidity/corpus/SimpleAuction.sol 11 auditor json > cli_smoke.json
          python -c "import json; d=json.load(open('cli_smoke.json')); assert d['task']=='11' and 'findings_count' in d, d; print('CLI JSON smoke OK:', d)"
