name: analyzer-image

# Builds and publishes the batch analyzer image (Dockerfile.analyzer), which is
# separate from the web-service image. Consumers pin a tag from here instead of
# building their own; see docs/analyzer-cli.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the short SHA)"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-analyzer

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build analyzer image
        run: |
          docker build -f Dockerfile.analyzer \
            --build-arg SG_ANALYZER_VERSION=${{ steps.version.outputs.value }} \
            -t analyzer:candidate .

      # The image is not published until it has proven it still runs with no
      # network, no capabilities, a read-only root and a non-root user.
      - name: Verify sandbox guarantees
        env:
          SG_ANALYZER_IMAGE: analyzer:candidate
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/integration/test_analyzer_sandbox.py -q

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker tag analyzer:candidate "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag analyzer:candidate "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
